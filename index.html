<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c5f59" id="theme-color">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A private personal tracker for sober days, fasting, goals, weight, gym, and savings. Data stays on this device.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <title>Personal Tracker</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="overlay" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <noscript>
    <p style="font-family: system-ui, sans-serif; padding: 24px;">Personal Tracker needs JavaScript. Your entries still stay in this browser. Nothing is sent to a server.</p>
  </noscript>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
